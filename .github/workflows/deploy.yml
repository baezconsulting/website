name: Deploy to SmarterASP.NET

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_FORMSPREE_ID: ${{ secrets.VITE_FORMSPREE_ID }}

      # lftp handles IIS FTPS (SmarterASP) data connections reliably.
      # Uploads dist/ over explicit TLS. It does not delete files on the server.
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload dist/ via FTPS
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          lftp --env-password -u "$FTP_USERNAME" winXXXX.site4now.net -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --no-perms --verbose --parallel=4 dist/ '${FTP_SERVER_DIR:-.}';
            bye"
